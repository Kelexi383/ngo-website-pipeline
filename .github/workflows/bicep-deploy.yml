name: Deploy Bicep Infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - 'infrastructure/**'
    branches: [main]

jobs:
  deploy-bicep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: 23338491-d465-48c6-acce-7a007161fa12
          resourceGroupName: CloudProject-RG-TF
          template: ./infrastructure/storage.bicep
          parameters: storageAccountName=staticweb8514
          failOnStdErr: false