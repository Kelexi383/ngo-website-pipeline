name: Deploy Static Website to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload files to Blob Storage
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name staticweb8514 \
              --destination '$web' \
              --source ./src \
              --overwrite

      - name: Show website URL
        run: echo "Deployed to https://staticweb8514.z4.web.core.windows.net/"